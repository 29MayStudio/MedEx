name: MedEx Weekly Scraper

on:
  schedule:
    # Run every Friday at 7:00 AM BST (Dhaka time) / 1:00 AM UTC
    - cron: '0 1 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp beautifulsoup4

      - name: Run scraper
        run: |
          python scraper.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add list.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update list.json [automated]" && git push)
